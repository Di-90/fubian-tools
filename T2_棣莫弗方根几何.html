<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棣莫弗公式与 n 次方根 · T2 · 复变函数与积分变换</title>
<style>
  /* ===== 共用脚手架样式（沿用 T1 风格）===== */
  :root{
    --z1:#2563eb;   /* 蓝：给定复数 z */
    --z2:#d97706;   /* 金：幂 zⁿ / 指针 */
    --res:#059669;  /* 绿：方根 wₖ */
    --mir:#7c3aed;  /* 紫：辅助 */
    --grid:#e6eaf0; --axis:#94a3b8; --circle:#cbd5e1;
    --ink:#1e293b; --sub:#64748b; --bg:#f5f7fa; --panel:#ffffff; --line:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
       color:var(--ink);background:var(--bg);}
  header.appbar{background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;
       padding:10px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header.appbar h1{font-size:18px;margin:0;font-weight:600;}
  header.appbar .sub{font-size:12.5px;opacity:.85;}
  header.appbar .tag{margin-left:auto;font-size:12px;background:rgba(255,255,255,.18);
       padding:3px 10px;border-radius:999px;}
  .wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap;}
  .stage{flex:1 1 520px;min-width:340px;background:var(--panel);border:1px solid var(--line);
       border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .side{flex:0 0 320px;display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
       box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600;letter-spacing:.3px;}
  canvas{width:100%;display:block;border-radius:8px;background:#fff;cursor:crosshair;touch-action:none;}
  .cv-wrap{position:relative;}
  #cvOverlay{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  #cvOverlay .lbl{position:absolute;white-space:nowrap;line-height:1;
       font-family:"Cambria Math","STIX Two Math",serif;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;}
  #cvOverlay .lbl math{font-size:1em;}
  .ops{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .ops button{flex:1 1 auto;min-width:120px;padding:9px 6px;border:1px solid var(--line);
       background:#fff;border-radius:8px;font-size:15px;cursor:pointer;color:var(--ink);
       transition:.15s;}
  .ops button:hover{border-color:var(--z1);}
  .ops button.active{background:var(--z1);color:#fff;border-color:var(--z1);}
  .toolbar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--sub);}
  .toolbar .zoom{margin-left:auto;display:flex;gap:6px;}
  .toolbar button.mini{border:1px solid var(--line);background:#fff;border-radius:6px;
       width:30px;height:28px;cursor:pointer;font-size:15px;line-height:1;}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .row .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .row label{width:26px;font-weight:600;}
  .row input[type=number]{width:74px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .row input[type=range]{flex:1;}
  .row .unit{color:var(--sub);}
  .readout{font-size:13px;line-height:1.7;background:#f8fafc;border:1px solid var(--line);
       border-radius:8px;padding:8px 10px;margin-top:6px;font-variant-numeric:tabular-nums;}
  .readout b{font-weight:600;}
  .rootlist{font-size:12.5px;line-height:1.75;margin-top:6px;max-height:190px;overflow:auto;}
  .rootlist .rk{display:flex;align-items:baseline;gap:6px;padding:2px 0;border-bottom:1px dashed #eef1f5;}
  .rootlist .rk .kk{color:var(--res);font-weight:600;min-width:30px;}
  .toggles{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .toggles label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .actions{display:flex;gap:8px;margin-top:4px;}
  .actions button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);
       background:#fff;cursor:pointer;font-size:13px;}
  .actions button.primary{background:var(--res);color:#fff;border-color:var(--res);}
  .hint{font-size:12.5px;color:var(--sub);line-height:1.6;}
  .warn{font-size:12px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;
       border-radius:8px;padding:7px 10px;margin-top:8px;display:none;}
  .val-res{color:var(--res);font-weight:600;}
  .val-pow{color:var(--z2);font-weight:600;}
  .math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:normal;font-size:14.5px;white-space:nowrap;}
  math{font-size:1.15em;}
  .readout math{font-size:1.06em;}
  .btn-play{padding:8px 18px;border:none;border-radius:8px;background:var(--res);color:#fff;
       font-size:14px;font-weight:600;cursor:pointer;}
  .btn-play:disabled{opacity:.55;cursor:default;}
  .btn-help{background:rgba(255,255,255,.18);border:none;color:#fff;padding:4px 12px;
       border-radius:999px;font-size:12.5px;cursor:pointer;}
  .btn-help:hover{background:rgba(255,255,255,.3);}
  #playHint{font-size:12.5px;color:var(--sub);}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;
       justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;
       padding:22px 26px;box-shadow:0 12px 44px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 4px;font-size:19px;color:var(--ink);}
  .modal h3{margin:18px 0 6px;font-size:15px;color:var(--z1);border-left:3px solid var(--z1);padding-left:8px;}
  .modal p,.modal li{font-size:13.5px;line-height:1.75;color:#334155;}
  .modal ul{margin:6px 0;padding-left:20px;}
  .modal .close{float:right;border:none;background:#f1f5f9;border-radius:8px;width:30px;height:30px;
       cursor:pointer;font-size:18px;color:var(--sub);line-height:1;}
  .modal .kbd{background:#eef2ff;color:#3730a3;padding:1px 7px;border-radius:5px;font-size:12.5px;}
</style>
</head>
<body>
<header class="appbar">
  <h1>棣莫弗公式与 n 次方根</h1>
  <span class="sub">幂 <math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mi>z</mi><mi>n</mi></msup></math> 的模与辐角 · 方根 <math xmlns="http://www.w3.org/1998/Math/MathML"><mroot><mi>z</mi><mi>n</mi></mroot></math> 的正 n 边形几何分布</span>
  <span class="tag">T2 · 复变函数与积分变换</span>
  <button class="btn-help" id="btnHelp">？使用说明</button>
</header>

<div class="wrap">
  <!-- 画布 -->
  <div class="stage">
    <div class="ops" id="ops">
      <button data-op="pow" class="active">棣莫弗幂　<math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mi>z</mi><mi>n</mi></msup></math></button>
      <button data-op="root"><math xmlns="http://www.w3.org/1998/Math/MathML"><mi>n</mi></math> 次方根　<math xmlns="http://www.w3.org/1998/Math/MathML"><mroot><mi>z</mi><mi>n</mi></mroot></math></button>
    </div>
    <div class="cv-wrap"><canvas id="cv"></canvas><div id="cvOverlay"></div></div>
    <div class="toolbar">
      <button class="btn-play" id="btnPlay">▶ 演示</button>
      <span id="playHint">显示初始向量 · 点击「演示」查看过程</span>
      <span class="zoom">
        <button class="mini" id="fit" title="适应视图">▣</button>
        <button class="mini" id="zin" title="放大">＋</button>
        <button class="mini" id="zout" title="缩小">－</button>
      </span>
    </div>
  </div>

  <!-- 侧栏 -->
  <div class="side">
    <div class="card">
      <h2>给定复数 z 与阶数 n</h2>
      <div class="row">
        <span class="dot" style="background:var(--z1)"></span>
        <label style="color:var(--z1)">z</label>
        <input type="number" id="zr" step="0.1" value="0.6">
        <span class="unit">+</span>
        <input type="number" id="zi" step="0.1" value="0.8">
        <span class="unit">i</span>
      </div>
      <div class="readout" id="roZ"></div>
      <div class="row" style="margin-top:12px">
        <label style="width:auto"><span class="math">n</span> =</label>
        <input type="range" id="nRange" min="2" max="8" step="1" value="3">
        <b id="nVal" style="min-width:16px;text-align:center">3</b>
      </div>
      <div class="warn" id="powWarn"></div>
    </div>

    <div class="card">
      <h2 id="resTitle">结果</h2>
      <div class="readout" id="roRes"></div>
      <div class="rootlist" id="rootList"></div>
      <div class="hint" id="lawHint" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>显示选项</h2>
      <div class="toggles">
        <label><input type="checkbox" id="tGrid" checked> 网格</label>
        <label><input type="checkbox" id="tCircle" checked> 单位圆</label>
        <label><input type="checkbox" id="tGen" checked> 生成圆 / 正 n 边形（方根）· 螺旋轨迹（幂）</label>
        <label><input type="checkbox" id="tLabel" checked> 顶点标注 wₖ 与中心角</label>
      </div>
      <div class="actions">
        <button id="btnReset">重置</button>
        <button id="btnExport" class="primary">导出使用数据</button>
      </div>
      <div class="hint" style="margin-top:8px">使用数据仅本机匿名记录（操作类型/次数），供教改成效分析，导出为 CSV。</div>
    </div>
  </div>
</div>

<!-- 使用说明弹窗 -->
<div class="modal-bg" id="helpModal">
  <div class="modal">
    <button class="close" id="helpClose">×</button>
    <h2>使用说明</h2>
    <div id="helpBody"></div>
  </div>
</div>

<script>
/* =======================================================================
   共用脚手架：匿名使用埋点（沿用 T1）
   ======================================================================= */
const EduTelemetry = (function(){
  const TOOL = "T2_棣莫弗方根几何";
  const KEY = "edutool_log_" + TOOL;
  let buf = [];
  try { buf = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ buf = []; }
  let lastThrottle = {};
  function log(event, detail, throttleMs){
    const now = Date.now();
    if(throttleMs){
      if(lastThrottle[event] && now - lastThrottle[event] < throttleMs) return;
      lastThrottle[event] = now;
    }
    buf.push({ t: new Date().toISOString(), tool: TOOL, event: event, detail: detail==null?"":String(detail) });
    if(buf.length > 5000) buf.splice(0, buf.length - 5000);
    try { localStorage.setItem(KEY, JSON.stringify(buf)); } catch(e){}
  }
  function exportCSV(){
    const rows = [["time","tool","event","detail"]];
    buf.forEach(r => rows.push([r.t, r.tool, r.event, '"'+r.detail.replace(/"/g,'""')+'"']));
    const csv = "﻿" + rows.map(r => r.join(",")).join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = TOOL + "_使用数据_" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }
  return { log, exportCSV, count: ()=>buf.length };
})();

/* =======================================================================
   T2 棣莫弗公式与 n 次方根
   ======================================================================= */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const overlay = document.getElementById("cvOverlay");

function clearLabels(){ overlay.innerHTML = ""; }
function addLabel(html, x, y, color, opts){
  opts = opts || {};
  const d = document.createElement("div");
  d.className = "lbl";
  d.style.left = x + "px"; d.style.top = y + "px";
  d.style.color = color;
  d.style.fontSize = (opts.size || 16) + "px";
  if(opts.weight) d.style.fontWeight = opts.weight;
  if(opts.alpha!=null) d.style.opacity = opts.alpha;
  d.style.transform = (opts.anchor==="c") ? "translate(-50%,-50%)" : "translateY(-100%)";
  d.innerHTML = html;
  overlay.appendChild(d);
}

// 状态
let state = {
  z: {re: 0.6, im: 0.8},
  n: 3,
  op: "pow",            // 'pow' | 'root'
  scale: 45,            // 每单位像素
  grid: true, circle: true, gen: true, label: true,
  drag: false,
  manualScale: false
};

// 动画：idle → anim → done
let anim = {phase:"idle", t:0, raf:0, start:0, dur:2200};
function easeIO(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
function setPhase(p){
  if(anim.raf){ cancelAnimationFrame(anim.raf); anim.raf=0; }
  anim.phase=p; anim.t = (p==="done")?1:0;
  updatePlayBtn(); draw();
}
function play(){
  if(anim.phase==="anim") return;
  anim.phase="anim"; anim.start=performance.now();
  anim.dur = state.op==="root" ? 2600 : 2200; updatePlayBtn();
  const stepf=(now)=>{
    const raw=Math.min(1,(now-anim.start)/anim.dur);
    anim.t=raw; draw();
    if(raw<1){ anim.raf=requestAnimationFrame(stepf); }
    else { anim.raf=0; anim.phase="done"; anim.t=1; updatePlayBtn(); draw(); EduTelemetry.log("demo", state.op+"/n="+state.n); }
  };
  anim.raf=requestAnimationFrame(stepf);
}
function updatePlayBtn(){
  const b=document.getElementById("btnPlay"), h=document.getElementById("playHint");
  if(!b) return;
  if(anim.phase==="idle"){ b.textContent="▶ 演示"; b.disabled=false;
    h.textContent = state.op==="root" ? "显示 z · 点击演示，指针转一圈依次落下各根" : "显示 z · 点击演示，看辐角 ×n、模 n 次方"; }
  else if(anim.phase==="anim"){ b.textContent="演示中…"; b.disabled=true; h.textContent="正在演示…"; }
  else { b.textContent="↻ 重放"; b.disabled=false; h.textContent="已显示结果"; }
}

// ---- 复数 ----
const C = {
  abs:(a)=>Math.hypot(a.re,a.im),
  arg:(a)=>Math.atan2(a.im,a.re)   // (-π, π]
};
// z 的 n 个 n 次方根
function rootsOf(z,n){
  const r = Math.pow(C.abs(z), 1/n), th = C.arg(z);
  const out=[];
  for(let k=0;k<n;k++){
    const a=(th+2*Math.PI*k)/n;
    out.push({re:r*Math.cos(a), im:r*Math.sin(a), arg:a, r:r, k:k});
  }
  return out;
}
// z 的 n 次幂
function powOf(z,n){
  const r=Math.pow(C.abs(z),n), a=C.arg(z)*n;
  return {re:r*Math.cos(a), im:r*Math.sin(a), r:r, arg:a};
}

// ---- 坐标 ----
let W=0, H=0, cx=0, cy=0, DPR=1;
function resize(){
  DPR = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  W = rect.width; H = Math.max(360, Math.min(560, rect.width));
  cv.style.height = H + "px";
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H/2;
  draw();
}
const toScreen = p => ({x: cx + p.re*state.scale, y: cy - p.im*state.scale});
const toWorld  = (x,y) => ({re:(x-cx)/state.scale, im:(cy-y)/state.scale});

// 依据当前模式的关键模长自动适配缩放
function fitView(){
  const az=C.abs(state.z);
  const target = Math.min(cx,cy)*0.80 || 200;
  let maxR;
  if(state.op==="root"){
    maxR = Math.max(az, Math.pow(az,1/state.n), 1);
    state.scale = Math.max(6, Math.min(240, target/maxR));
  } else {
    // 幂：以 zⁿ 定尺度；但 |z| 很大时 zⁿ 会爆炸，此时保证 z 本身仍清晰可见（zⁿ 可溢出画布，由提示引导）
    maxR = Math.max(az, Math.pow(az,state.n), 1);
    let s = target/maxR;
    if(az>0 && az*s < 26) s = target/Math.max(az,1);   // z 太小则改按 z 适配
    state.scale = Math.max(6, Math.min(240, s));
  }
  state.manualScale=false;
}

// ---- 数字格式 ----
function fmt(x){ let v = Math.round(x*100)/100; if(Object.is(v,-0)) v=0; return String(v).replace("-","−"); }
const deg = r => { let d=Math.round(r*180/Math.PI*10)/10; d=((d%360)+360)%360; return d; };
const degRaw = r => Math.round(r*180/Math.PI*10)/10;
// 主辐角 (−180°, 180°]
const degPrincipal = r => { let d=degRaw(r); d=((d%360)+360)%360; if(d>180)d-=360; return Math.round(d*10)/10; };

// ---- MathML ----
function mml(inner){ return `<math xmlns="http://www.w3.org/1998/Math/MathML">${inner}</math>`; }
const X = {
  z:`<mi>z</mi>`,
  w:`<mi>w</mi>`,
  i:`<mi>i</mi>`,
  n:`<mi>n</mi>`,
  num:(v)=>`<mn>${v}</mn>`,
  op:(s)=>`<mo>${s}</mo>`,
  wk:(k)=>`<msub><mi>w</mi><mn>${k}</mn></msub>`,
  pow:(base,p)=>`<msup>${base}${p}</msup>`,
  nroot:(inner)=>`<mroot>${inner}<mi>n</mi></mroot>`,
  abs:(x)=>`<mrow><mo>|</mo>${x}<mo>|</mo></mrow>`,
  arg:(x)=>`<mrow><mi>arg</mi><mspace width="0.17em"/>${x}</mrow>`,
  frac:(a,b)=>`<mfrac>${a}${b}</mfrac>`,
  th:`<mi>&#x3B8;</mi>`,
  row:(...xs)=>`<mrow>${xs.join("")}</mrow>`
};
function mmlComplex(z){
  let r=Math.round(z.re*100)/100, i=Math.round(z.im*100)/100;
  if(Object.is(r,-0))r=0; if(Object.is(i,-0))i=0;
  const num=(v)=>`<mn>${Math.abs(v)}</mn>`;
  if(i===0) return `${r<0?`<mo>&#x2212;</mo>`:""}${num(r)}`;
  const ai=Math.abs(i), coef = ai===1 ? "" : `<mn>${ai}</mn>`;
  if(r===0) return `${i<0?`<mo>&#x2212;</mo>`:""}${coef}${X.i}`;
  return `${r<0?`<mo>&#x2212;</mo>`:""}<mn>${Math.abs(r)}</mn><mo>${i<0?"&#x2212;":"+"}</mo>${coef}${X.i}`;
}

// =======================================================================
// 绘制
// =======================================================================
function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function draw(){
  ctx.clearRect(0,0,W,H);
  clearLabels();
  if(state.grid) drawGrid();
  drawAxes();
  if(state.circle) drawUnitCircle();
  if(state.op==="root") drawRootMode();
  else drawPowMode();
  updatePanels();
}

function drawGrid(){
  ctx.lineWidth=1; ctx.strokeStyle=getVar("--grid");
  const stepPx=state.scale;
  ctx.beginPath();
  for(let x=cx%stepPx; x<W; x+=stepPx){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(let y=cy%stepPx; y<H; y+=stepPx){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
}
function drawAxes(){
  ctx.lineWidth=1.5; ctx.strokeStyle=getVar("--axis");
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.moveTo(cx,0); ctx.lineTo(cx,H); ctx.stroke();
  arrowHead(W-2,cy,0); arrowHead(cx,2,-Math.PI/2);
  ctx.fillStyle=getVar("--sub"); ctx.font="11px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top";
  const stepU = niceStep(state.scale);
  const n=Math.ceil((W/2)/(stepU*state.scale));
  for(let k=-n;k<=n;k++){ if(k===0) continue; const sx=cx+k*stepU*state.scale; if(sx>10&&sx<W-12) ctx.fillText(fmt(k*stepU),sx,cy+4); }
  ctx.textAlign="right"; ctx.textBaseline="middle";
  const m=Math.ceil((H/2)/(stepU*state.scale));
  for(let k=-m;k<=m;k++){ if(k===0) continue; const sy=cy-k*stepU*state.scale; if(sy>10&&sy<H-10) ctx.fillText(fmt(k*stepU),cx-6,sy); }
  ctx.fillStyle=getVar("--ink"); ctx.font="12px sans-serif";
  ctx.textAlign="right"; ctx.textBaseline="top"; ctx.fillText("Re",W-6,cy+6);
  ctx.textAlign="left"; ctx.fillText("Im",cx+6,4);
}
// 刻度间隔：像素太密时按 1/2/5×10ⁿ 取整
function niceStep(scale){
  const target=64; let s=target/scale;
  const p=Math.pow(10,Math.floor(Math.log10(s))); const f=s/p;
  const step = f<1.5?1 : f<3.5?2 : f<7.5?5 : 10;
  return step*p;
}
function arrowHead(x,y,ang){
  const s=7; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillStyle=getVar("--axis");
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-s,-s/2); ctx.lineTo(-s,s/2); ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawUnitCircle(){
  ctx.lineWidth=1.2; ctx.strokeStyle=getVar("--circle"); ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(cx,cy,state.scale,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
}
function dashCircleR(rWorld,color,alpha,label){
  const R=rWorld*state.scale;
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.3; ctx.globalAlpha=alpha==null?.7:alpha; ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke(); ctx.restore();
  if(label){ addLabel(label, cx+R*0.707+6, cy-R*0.707-4, color, {anchor:"lb", size:13, alpha:alpha==null?.9:Math.min(1,alpha+.3)}); }
}
// 从原点沿给定世界辐角画一条径向虚线（像素长度），用于展示等分角
function drawRadialPx(angle,radPx,color,alpha){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1; if(alpha!=null)ctx.globalAlpha=alpha; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(angle)*radPx, cy-Math.sin(angle)*radPx); ctx.stroke(); ctx.restore();
}
function drawVector(z,color,label,solid,alpha){
  const s=toScreen(z);
  ctx.save();
  if(alpha!=null) ctx.globalAlpha=alpha;
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2.4; ctx.setLineDash(solid?[]:[6,5]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(s.x,s.y); ctx.stroke(); ctx.setLineDash([]);
  const ang=Math.atan2(s.y-cy,s.x-cx); arrowAt(s.x,s.y,ang,color);
  drawPoint(z,color,false);
  ctx.restore();
  if(label){ addLabel(label, s.x+8, s.y-6, color, {anchor:"lb", size:16, alpha:alpha==null?1:alpha}); }
}
function arrowAt(x,y,ang,color){
  const s=9; ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-s,-s/2.4); ctx.lineTo(-s,s/2.4); ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawPoint(z,color,big){
  const s=toScreen(z); ctx.fillStyle=color; ctx.strokeStyle="#fff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(s.x,s.y, big?7:5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
}
// 原点处角弧 a0→a1（世界角，逆时针），可跨多圈
function drawArc(a0,a1,radPx,color,label,alpha){
  ctx.save(); if(alpha!=null) ctx.globalAlpha=alpha;
  ctx.strokeStyle=color; ctx.lineWidth=1.8; ctx.beginPath();
  const span=a1-a0, N=Math.max(24,Math.ceil(Math.abs(span)/(Math.PI/40)));
  for(let i=0;i<=N;i++){ const a=a0+span*i/N; const x=cx+Math.cos(a)*radPx, y=cy-Math.sin(a)*radPx;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke(); ctx.restore();
  if(label){ const am=(a0+a1)/2, lr=radPx+16; addLabel(label, cx+Math.cos(am)*lr, cy-Math.sin(am)*lr, color, {anchor:"c", size:14, alpha:alpha==null?1:alpha}); }
}

// ---- 方根模式 ----
function drawRootMode(){
  const CZ=getVar("--z1"), CR=getVar("--res"), CP=getVar("--z2");
  const {z,n}=state;
  const roots=rootsOf(z,n);
  const rr=roots[0].r;                 // 生成圆半径 |z|^{1/n}
  const az=C.abs(z), th=C.arg(z);      // z 的模、辐角
  const w0a=roots[0].arg;              // w₀ 辐角 = θ/n
  const ph=anim.phase, t=anim.t;
  const LZ=mml(X.z);

  // 参考圆：生成圆 |z|^{1/n}（绿）与 z 的模长圆 |z|（蓝，仅当两者不同）
  if(state.gen){
    dashCircleR(rr,CR, ph==="idle"?.55:.8, state.label?mml(X.nroot(X.abs(X.z))):null);
    if(Math.abs(az-rr)>0.02) dashCircleR(az,CZ,.38, state.label?mml(X.abs(X.z)):null);
  }
  // z 向量与它的辐角 θ（外圈弧）—— 交代"原复数的辐角"
  drawVector(z,CZ,LZ,true, ph==="idle"?1:.4);
  if(state.label && Math.abs(th)>1e-3) drawArc(0,th, arcRadiusFor(az,50), CZ, mml(X.th), .85);
  // w₀ 的辐角 θ/n（内圈弧）—— 显式画出"辐角除以 n"，答疑 w₀ 从哪来
  if(state.label && Math.abs(w0a)>1e-3) drawArc(0,w0a, arcRadiusFor(rr,26), CR, mml(X.frac(X.th,X.n)), .95);

  if(ph==="idle"){
    drawRootPoint(roots[0],CR,state.label);   // 先画出 w₀，配合 θ/n 弧看清来历
    return;
  }

  if(ph==="anim"){
    // 指针从 w₀ 的辐角开始转满一圈，越过的根依次落下
    const a0=w0a, sweep=2*Math.PI*t, curA=a0+sweep;
    roots.forEach(rt=>{
      let rel=rt.arg-a0; rel=((rel%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
      if(rel<=sweep+1e-9){ drawRootPoint(rt,CR,state.label); }
    });
    const tip={re:rr*Math.cos(curA), im:rr*Math.sin(curA)};
    drawVector(tip,CP,"",true);
    drawArc(a0,curA,arcRadiusFor(rr,34),CP,"",.9);
    return;
  }
  // done：正 n 边形 + 全部根 + 相邻中心角
  if(state.gen && n>=2){
    ctx.save(); ctx.strokeStyle=CR; ctx.lineWidth=2; ctx.globalAlpha=.9; ctx.beginPath();
    roots.forEach((rt,idx)=>{ const s=toScreen(rt); if(idx===0)ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y); });
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  roots.forEach(rt=> drawRootPoint(rt,CR,state.label));
  // 相邻两根之间的中心角 2π/n（放在 θ/n 弧外一点，避免重叠）
  if(state.label && n>=2){
    drawArc(w0a, roots[1].arg, arcRadiusFor(rr,40), CP,
      mml(X.frac(X.row(X.num(2),X.op("&#x3C0;")),X.n)), .95);
  }
}
function drawRootPoint(rt,color,withLabel){
  const s=toScreen(rt);
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(s.x,s.y); ctx.stroke();
  drawPoint(rt,color,false);
  if(withLabel) addLabel(mml(X.wk(rt.k)), s.x+8, s.y-6, color, {anchor:"lb", size:15});
}
function arcRadiusFor(rWorld,base){ const len=rWorld*state.scale; return Math.max(16,Math.min(base,len*0.6)); }

// ---- 幂模式 ----
function drawPowMode(){
  const CZ=getVar("--z1"), CP=getVar("--z2");
  const {z,n}=state;
  const r0=C.abs(z), a0=C.arg(z);
  const zn=powOf(z,n);
  const ph=anim.phase, t=anim.t;
  const LZ=mml(X.z), LZN=mml(X.pow(X.z,X.n));

  if(ph==="idle"){
    drawVector(z,CZ,LZ,true);
    // 静止时也画出 z 的辐角 θ，作为"辐角 ×n"的起点
    if(state.label && Math.abs(a0)>1e-3) drawArc(0,a0,arcRadiusFor(r0,42),CZ,mml(X.th),.85);
    return;
  }

  // 目标：辐角 a0→n·a0（从实轴 0 累积），模 r0→r0^n（连续插值 r0^{1+s(n-1)}）
  const e = ph==="done" ? 1 : easeIO(t);
  const expo = 1 + e*(n-1);
  const curA = a0*expo;                 // 累积辐角（可超出主值范围）
  const curR = Math.pow(r0, expo);
  const cur={re:curR*Math.cos(curA), im:curR*Math.sin(curA)};

  // 模长参考圆：|z|（蓝）与 |z|ⁿ（金），展示"模作 n 次方"
  if(state.gen && Math.abs(r0-1)>0.02){
    dashCircleR(r0,CZ,.5, state.label?mml(X.abs(X.z)):null);
    if(ph==="done") dashCircleR(zn.r,CP,.5, state.label?mml(X.abs(X.pow(X.z,X.n))):null);
  }
  // 螺旋轨迹（从 z 盘旋到 zⁿ）
  if(state.gen){
    ctx.save(); ctx.strokeStyle=CP; ctx.lineWidth=1.6; ctx.globalAlpha=.5; ctx.setLineDash([2,3]);
    ctx.beginPath();
    const N=120;
    for(let i=0;i<=N;i++){
      const s=e*i/N, ex=1+s*(n-1), a=a0*ex, rr=Math.pow(r0,ex);
      const p=toScreen({re:rr*Math.cos(a), im:rr*Math.sin(a)});
      if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }

  const resArcR = arcRadiusFor(Math.max(curR,r0),54);
  // 完成时：n 条等角径向线，把总辐角切成 n 份 θ —— 让"辐角 ×n"看得见
  if(ph==="done" && state.label && Math.abs(a0)>1e-3){
    for(let k=1;k<n;k++) drawRadialPx(k*a0, resArcR+8, CP, .45);
  }
  // 起始 z（半透明）+ 它的辐角 θ（内圈）
  drawVector(z,CZ,LZ,true,ph==="done"?.4:.55);
  if(state.label && Math.abs(a0)>1e-3) drawArc(0,a0,arcRadiusFor(Math.min(curR,r0),34),CZ,mml(X.th),.75);
  // 结果辐角弧：从实轴 0 累积到 curA（= n·θ），这才是 arg(zⁿ)
  drawArc(0,curA,resArcR,CP,
    ph==="done"?mml(X.row(X.n,X.op("&#x22C5;"),X.arg(X.z))):"", .9);
  // 当前/结果向量
  drawVector(cur,CP, ph==="done"?LZN:"", true);
}

function updatePanels(){
  const {z,n,op}=state;
  document.getElementById("roZ").innerHTML =
    `${mml(X.z)} = <b>${mml(mmlComplex(z))}</b>　·　模 ${mml(X.abs(X.z))} = <b>${fmt(C.abs(z))}</b>，辐角 ${mml(X.arg(X.z))} = <b>${fmt(degRaw(C.arg(z)))}°</b>`;

  const title=document.getElementById("resTitle");
  const roRes=document.getElementById("roRes");
  const list=document.getElementById("rootList");
  const law=document.getElementById("lawHint");
  const warn=document.getElementById("powWarn");
  list.innerHTML=""; warn.style.display="none";

  if(op==="root"){
    title.innerHTML = `n 次方根　${mml(X.nroot(X.z))}`;
    const roots=rootsOf(z,n), rr=roots[0].r;
    roRes.innerHTML =
      `${n} 个根都在圆 ${mml(X.row(X.abs(X.w),X.op("="),X.nroot(X.abs(X.z))))} = <b>${fmt(rr)}</b> 上，`+
      `相邻辐角相差 ${mml(X.frac(X.row(X.num(2),X.op("&#x3C0;")),X.n))} = <b>${fmt(360/n)}°</b>，构成<b>正 ${n} 边形</b>。`;
    roRes.innerHTML +=
      `<br>其中 ${mml(X.wk(0))} 的辐角 ${mml(X.row(X.op("="),X.frac(X.arg(X.z),X.n)))} = <b>${fmt(degRaw(C.arg(z)/n))}°</b>`+
      `（把 ${mml(X.arg(X.z))} 除以 ${n}），其余各根依次再加 ${mml(X.frac(X.row(X.num(2),X.op("&#x3C0;")),X.n))}。`;
    roots.forEach(rt=>{
      list.innerHTML += `<div class="rk"><span class="kk">${mml(X.wk(rt.k))}</span>`+
        `<span>= <b>${mml(mmlComplex(rt))}</b>，辐角 ${fmt(degRaw(rt.arg))}°</span></div>`;
    });
    law.innerHTML = `<b>公式：</b>`+
      mml(X.row(X.wk("k"),X.op("="),X.nroot(X.abs(X.z)),
        `<mrow><mo>(</mo><mi>cos</mi><mfrac><mrow>${X.th}<mo>+</mo><mn>2</mn><mi>k</mi><mo>&#x3C0;</mo></mrow><mi>n</mi></mfrac><mo>+</mo>${X.i}<mi>sin</mi><mfrac><mrow>${X.th}<mo>+</mo><mn>2</mn><mi>k</mi><mo>&#x3C0;</mo></mrow><mi>n</mi></mfrac><mo>)</mo></mrow>`))+
      `　`+mml(`<mo>(</mo><mi>k</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mo>&#x2026;</mo><mo>,</mo><mi>n</mi><mo>&#x2212;</mo><mn>1</mn><mo>)</mo>`);
  } else {
    title.innerHTML = `棣莫弗幂　${mml(X.pow(X.z,X.n))}`;
    const zn=powOf(z,n);
    const accDeg=degRaw(zn.arg), prinDeg=degPrincipal(zn.arg);
    const wrapped=Math.abs(accDeg-prinDeg)>0.05;
    roRes.innerHTML =
      `${mml(X.pow(X.z,X.n))} = <span class="val-pow">${mml(mmlComplex(zn))}</span><br>`+
      `模 ${mml(X.row(X.abs(X.pow(X.z,X.n)),X.op("="),X.pow(X.abs(X.z),X.n)))} = <b>${fmt(zn.r)}</b>，`+
      `辐角（累积）${mml(X.row(X.op("="),X.n,X.op("&#x22C5;"),X.arg(X.z)))} = <b>${fmt(accDeg)}°</b>`+
      (wrapped?`<br><span style="color:var(--sub)">超过一圈，落点主辐角 ${mml(X.arg(X.pow(X.z,X.n)))} = <b>${fmt(prinDeg)}°</b>（累积角 mod 360°）</span>`:"");
    const r0=C.abs(z);
    if(Math.abs(r0-1)<0.02){
      law.innerHTML = `<b>棣莫弗公式（模为 1）：</b><br>`+
        mml(`<msup><mrow><mo>(</mo><mi>cos</mi>${X.th}<mo>+</mo>${X.i}<mi>sin</mi>${X.th}<mo>)</mo></mrow><mi>n</mi></msup><mo>=</mo><mi>cos</mi><mi>n</mi>${X.th}<mo>+</mo>${X.i}<mi>sin</mi><mi>n</mi>${X.th}`)+
        `<br>此时只旋转不伸缩：辐角 ×${n}，模恒为 1（结果在单位圆上）。`;
    } else {
      law.innerHTML = `<b>一般幂：</b>模作 ${n} 次方、辐角乘 ${n}。<br>`+
        mml(X.row(X.pow(X.z,X.n),X.op("="),X.pow(X.abs(X.z),X.n),
          `<mrow><mo>(</mo><mi>cos</mi><mi>n</mi>${X.th}<mo>+</mo>${X.i}<mi>sin</mi><mi>n</mi>${X.th}<mo>)</mo></mrow>`));
      warn.style.display="block";
      warn.innerHTML = `幂随模长增长很快（当前 ${mml(X.abs(X.pow(X.z,X.n)))} = <b>${fmt(zn.r)}</b>）。要看纯粹的棣莫弗旋转，把 <span class="math">z</span> 拖到<b>单位圆上</b>（模 = 1）。`;
    }
  }
}

function evtPos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function near(z,x,y){ const s=toScreen(z); return Math.hypot(s.x-x,s.y-y)<18; }

function onDown(e){
  const {x,y}=evtPos(e);
  if(near(state.z,x,y)){ state.drag=true; e.preventDefault(); if(anim.phase!=="idle") setPhase("idle"); }
}
function onMove(e){
  if(!state.drag) return;
  const {x,y}=evtPos(e); const w=toWorld(x,y);
  state.z={re:Math.round(w.re*100)/100, im:Math.round(w.im*100)/100};
  syncInputs(); draw();
  EduTelemetry.log("drag_z","",400);
  e.preventDefault();
}
function onUp(){ if(state.drag) EduTelemetry.log("drag_end"); state.drag=false; }

cv.addEventListener("mousedown",onDown); window.addEventListener("mousemove",onMove); window.addEventListener("mouseup",onUp);
cv.addEventListener("touchstart",onDown,{passive:false}); cv.addEventListener("touchmove",onMove,{passive:false}); cv.addEventListener("touchend",onUp);
cv.addEventListener("wheel",e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.9;
  state.scale=Math.max(6,Math.min(240,state.scale*f)); state.manualScale=true; draw(); },{passive:false});

// 模式切换
document.getElementById("ops").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  [...document.querySelectorAll("#ops button")].forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); state.op=b.dataset.op;
  if(!state.manualScale) fitView();
  setPhase("idle"); EduTelemetry.log("mode", state.op);
});

function syncInputs(){ zr.value=fmt(state.z.re).replace("−","-"); zi.value=fmt(state.z.im).replace("−","-"); }
["zr","zi"].forEach(id=>{
  document.getElementById(id).addEventListener("input",()=>{
    state.z={re:+zr.value||0, im:+zi.value||0};

    setPhase("idle"); EduTelemetry.log("input_z",id,600);

});
const nRange=document.getElementById("nRange"), nVal=document.getElementById("nVal");
