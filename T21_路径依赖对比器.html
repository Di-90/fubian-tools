<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T21 路径依赖对比器</title>
<style>
  :root{
    --blue:#2b6cb0; --gold:#b7791f; --orange:#dd6b20; --green:#2f855a; --purple:#6b46c1;
    --red:#c53030; --ink:#1a202c; --sub:#4a5568; --line:#e2e8f0; --bg:#f7fafc; --card:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; color:var(--ink);
       background:var(--bg); line-height:1.55;}
  math{font-family:"Cambria Math","STIX Two Math",serif;}
  .top{display:flex; align-items:center; justify-content:flex-start; gap:12px; flex-wrap:wrap;
       padding:12px 18px; background:linear-gradient(90deg,#1e3a8a,#2563eb); color:#fff;}
  .top h1{font-size:18px; margin:0; letter-spacing:.5px; font-weight:600;}
  .top .hint{font-size:12.5px; color:rgba(255,255,255,.85);}
  .top .tag{margin-left:auto; font-size:12px; background:rgba(255,255,255,.18);
       padding:3px 10px; border-radius:999px; white-space:nowrap;}
  #helpBtn{border:none; background:rgba(255,255,255,.18); border-radius:999px; cursor:pointer;
           font-size:12.5px; padding:5px 13px; color:#fff;}
  #helpBtn:hover{background:rgba(255,255,255,.3);}
  .main{display:flex; gap:16px; padding:16px; align-items:stretch; height:calc(100% - 55px);}
  .cv-wrap{position:relative; flex:1; min-width:0; background:#fdfdfe;
           border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  #cv{display:block; width:100%; height:100%; cursor:crosshair;}
  #cv.grabbing{cursor:grabbing;}
  #cvOverlay{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  #cvOverlay .lbl{position:absolute; white-space:nowrap; line-height:1; font-size:15px;
       font-family:"Cambria Math","STIX Two Math",serif;
       text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff; transform:translate(-50%,-50%);}
  .panel{width:326px; flex:none; display:flex; flex-direction:column; gap:12px; overflow:auto;}
  .box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px;}
  .box h2{font-size:13px; margin:0 0 9px; color:var(--sub); letter-spacing:1px; font-weight:700;}
  .row{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .row label{font-size:13px; min-width:60px; color:var(--sub);}
  .row input[type=number]{width:74px; padding:4px 6px; border:1px solid var(--line);
       border-radius:6px; font-size:14px;}
  .fbtns,.cbtns{display:flex; flex-wrap:wrap; gap:6px;}
  .fbtns button,.cbtns button{border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer;
       font-size:13.5px; padding:5px 9px; color:var(--ink); min-height:32px;}
  .fbtns button:hover,.cbtns button:hover{background:#f0f5fa; border-color:var(--blue);}
  .fbtns button.sel,.cbtns button.sel{background:#ebf4ff; border-color:var(--blue); color:var(--blue); font-weight:700;}
  .btns{display:flex; flex-wrap:wrap; gap:7px;}
  .btns button{border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer;
       font-size:13px; padding:6px 10px; color:var(--ink);}
  .btns button:hover{background:#f0f5fa; border-color:var(--blue);}
  .btns button.go{background:#f0fff4; border-color:#9ae6b4; color:#22643a; font-weight:600;}
  .btns button.go:hover{background:#c6f6d5;}
  .toggles label{display:flex; align-items:center; gap:6px; font-size:13px; margin:5px 0; color:var(--ink); cursor:pointer;}
  .readout{font-size:13.5px; color:var(--ink);}
  .readout .k{color:var(--sub);}
  .readout .big{font-size:15px;}
  .readout div{margin:5px 0;}
  .val{background:#f7fafc; border:1px solid var(--line); border-radius:8px; padding:7px 10px; margin:6px 0;}
  .val .t{font-size:11.5px; color:var(--sub); display:block; margin-bottom:2px;}
  .val.p1{border-left:4px solid #2563eb;}
  .val.p2{border-left:4px solid #dd6b20;}
  .val.p3{border-left:4px solid #2f855a;}
  .corr{margin-top:8px; padding:8px 10px; border-radius:8px; background:#f0fff4;
        border:1px solid #c6f6d5; font-size:13px; color:#22543d;}
  .corr.warn{background:#fffaf0; border-color:#feebc8; color:#7b341e;}
  .verdict{margin-top:6px; padding:9px 11px; border-radius:9px; font-size:14px; font-weight:600;}
  .verdict.indep{background:#ebf8ff; border:1px solid #90cdf4; color:#2a4365;}
  .verdict.dep{background:#fff5f5; border:1px solid #feb2b2; color:#742a2a;}
  .legend{display:flex; flex-wrap:wrap; gap:10px; font-size:12.5px; color:var(--sub);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .bar{width:16px; height:3px; border-radius:2px; display:inline-block;}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block; border:2px solid #2563eb; background:#fff;}
  .foot{font-size:11.5px; color:#a0aec0; text-align:center;}
  #mask{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:50;}
  #modal{position:fixed; z-index:51; left:50%; top:50%; transform:translate(-50%,-50%);
         width:min(700px,92vw); max-height:86vh; overflow:auto; background:#fff;
         border-radius:14px; padding:22px 26px; box-shadow:0 12px 40px rgba(0,0,0,.25); display:none;}
  #modal h2{margin:0 0 6px; font-size:19px;}
  #modal h3{font-size:15px; margin:16px 0 4px; color:var(--blue);}
  #modal p,#modal li{font-size:14px; color:#2d3748; margin:5px 0;}
  #modal .x{position:absolute; right:16px; top:12px; border:none; background:none;
            font-size:22px; cursor:pointer; color:var(--sub);}
  math{font-size:1.08em;}
  .readout math{font-size:1.14em;}
  .corr math,.verdict math{font-size:1.04em;}
  .fbtns button math{font-size:1.05em;}

  @media (max-width:820px){
    html,body{height:auto;}
    .top{flex-wrap:wrap; gap:6px 10px; padding:10px 14px;}
    .top h1{font-size:16px;}
    .main{flex-direction:column; height:auto; padding:12px; gap:12px;}
    .cv-wrap{flex:none; width:100%; height:56vh; min-height:340px;}
    .panel{width:100%; flex:none; overflow:visible;}
  }
</style>
</head>
<body>
  <div class="top">
    <h1>路径依赖对比器</h1>
    <span class="hint">拖动端点与路径，实时对比同一 <math><mo>&#x222B;</mo><mi>f</mi><mo>(</mo><mi>z</mi><mo>)</mo><mi>d</mi><mi>z</mi></math> 沿不同路径的值：解析 ⇔ 路径无关</span>
    <a class="tag" href="./index.html" style="color:#fff;text-decoration:none;cursor:pointer">← 返回主页</a>
    <button id="helpBtn">？使用说明</button>
  </div>

  <div class="main">
    <div class="cv-wrap">
      <canvas id="cv"></canvas>
      <div id="cvOverlay"></div>
    </div>

    <div class="panel">
      <div class="box">
        <h2>被积函数 <math><mi>f</mi><mo>(</mo><mi>z</mi><mo>)</mo></math></h2>
        <div class="fbtns" id="funcBtns"></div>
      </div>

      <div class="box" id="customBox" style="display:none;">
        <h2>自定义 <math><mi>f</mi><mo>(</mo><mi>z</mi><mo>)</mo></math></h2>
        <input id="customIn" type="text" spellcheck="false" autocomplete="off"
               style="width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                      font-size:15px; font-family:Consolas,'Courier New',monospace;" value="conj(z)">
        <div id="customPrev" style="margin:9px 0 2px; font-size:16px; min-height:24px; color:var(--ink);"></div>
        <div id="customErr" style="font-size:12px; color:#c53030; min-height:0;"></div>
        <p style="font-size:11.5px;color:var(--sub);margin:6px 0 0;line-height:1.55;">
          可用 <b>z　i　e　pi</b>，运算 <b>+ − * / ^</b>，函数
          <b>exp　ln　sin　cos　conj　re　im　abs</b> 等；支持隐式乘法。<br>
          例：<code>z</code>　<code>conj(z)</code>　<code>re(z)</code>　<code>z^2</code>　<code>1/z</code>
        </p>
      </div>

      <div class="box">
        <h2>端点</h2>
        <div class="row"><label>起点 A</label>
          <input id="ax" type="number" step="0.1"> + <input id="ay" type="number" step="0.1"> i</div>
        <div class="row"><label>终点 B</label>
          <input id="bx" type="number" step="0.1"> + <input id="by" type="number" step="0.1"> i</div>
        <p style="font-size:12px;color:var(--sub);margin:4px 0 0;">也可直接在图上拖动 A、B 及橙/绿控制点。</p>
      </div>

      <div class="box">
        <div class="btns">
          <button id="bAnim" class="go">▶ 三条路径同时积分</button>
          <button id="bReset">复位视图</button>
        </div>
      </div>

      <div class="box readout" id="readout"></div>

      <div class="box toggles">
        <h2>显示选项</h2>
        <label><input type="checkbox" id="tVals" checked> 在图上标注各路径积分值</label>
        <label><input type="checkbox" id="tGrid" checked> 参考网格</label>
        <label><input type="checkbox" id="tAxis" checked> 坐标轴</label>
      </div>

      <div class="box">
        <h2>图例</h2>
        <div class="legend">
          <span><i class="bar" style="background:#2563eb"></i>路径①直线</span>
          <span><i class="bar" style="background:#dd6b20"></i>路径②折线</span>
          <span><i class="bar" style="background:#2f855a"></i>路径③曲线</span>
          <span><i class="dot"></i>可拖动点</span>
        </div>
        <div class="btns" style="margin-top:10px;">
          <button id="bExport">导出使用数据</button>
        </div>
      </div>

      <div class="foot">复变函数与积分变换 · 教学可视化</div>
    </div>
  </div>

  <div id="mask"></div>
  <div id="modal">
    <button class="x" id="modalX">×</button>
    <div id="helpBody"></div>
  </div>

<script>
/* ============ 匿名使用埋点（本机 localStorage，可导出 CSV）============ */
const EduTelemetry = (function(){
  const KEY="edu_telemetry_T21"; let buf=[];
  try{ buf=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ buf=[]; }
  function log(type,detail){
    buf.push({t:new Date().toISOString(), type:type, detail:detail==null?"":String(detail)});
    if(buf.length>2000) buf=buf.slice(-2000);
    try{ localStorage.setItem(KEY, JSON.stringify(buf)); }catch(e){}
  }
  function exportCSV(){
    const rows=[["time","type","detail"]].concat(buf.map(r=>[r.t,r.type,r.detail.replace(/[,\n]/g,";")]));
    const csv=rows.map(r=>r.join(",")).join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="T21_使用数据.csv"; document.body.appendChild(a); a.click(); a.remove();
  }
  return {log, exportCSV};
})();

/* ============ 公式（MathML）============ */
function mml(inner){ return `<math xmlns="http://www.w3.org/1998/Math/MathML">${inner}</math>`; }
function fmt(v){ if(!isFinite(v)) return "∞"; let r=Math.round(v*1000)/1000; if(Object.is(r,-0))r=0; return String(r).replace("-","−"); }
function mmlComplex(re,im){
  let r=Math.round(re*1000)/1000, i=Math.round(im*1000)/1000;
  if(Object.is(r,-0))r=0; if(Object.is(i,-0))i=0;
  if(!isFinite(r)||!isFinite(i)) return `<mi>&#x221E;</mi>`;
  if(i===0) return `<mn>${fmt(r)}</mn>`;
  const ai=Math.abs(i), coef = ai===1 ? "" : `<mn>${fmt(ai)}</mn>`;
  if(r===0) return `${i<0?`<mo>&#x2212;</mo>`:""}${coef}<mi>i</mi>`;
  return `<mn>${fmt(r)}</mn><mo>${i<0?"&#x2212;":"+"}</mo>${coef}<mi>i</mi>`;
}
function round3(v){ return Math.round(v*1000)/1000; }
const INT = "<mo>&#x222B;</mo><mi>f</mi><mo>(</mo><mi>z</mi><mo>)</mo><mspace width='1px'/><mi>d</mi><mi>z</mi>";

/* ============ 复数运算 ============ */
const ONE={x:1,y:0};
function cadd(a,b){return{x:a.x+b.x,y:a.y+b.y};}
function csub(a,b){return{x:a.x-b.x,y:a.y-b.y};}
function cmul(a,b){return{x:a.x*b.x-a.y*b.y,y:a.x*b.y+a.y*b.x};}
function cdiv(a,b){const d=b.x*b.x+b.y*b.y;return{x:(a.x*b.x+a.y*b.y)/d,y:(a.y*b.x-a.x*b.y)/d};}
function cscale(a,k){return{x:a.x*k,y:a.y*k};}
function cconj(a){return{x:a.x,y:-a.y};}
function cexp(a){const e=Math.exp(a.x);return{x:e*Math.cos(a.y),y:e*Math.sin(a.y)};}
function csin(a){return{x:Math.sin(a.x)*Math.cosh(a.y),y:Math.cos(a.x)*Math.sinh(a.y)};}
function ccos(a){return{x:Math.cos(a.x)*Math.cosh(a.y),y:-Math.sin(a.x)*Math.sinh(a.y)};}
function ctan(a){return cdiv(csin(a),ccos(a));}
function csinh(a){return{x:Math.sinh(a.x)*Math.cos(a.y),y:Math.cosh(a.x)*Math.sin(a.y)};}
function ccosh(a){return{x:Math.cosh(a.x)*Math.cos(a.y),y:Math.sinh(a.x)*Math.sin(a.y)};}
function ctanh(a){return cdiv(csinh(a),ccosh(a));}
function clog(a){return{x:Math.log(Math.hypot(a.x,a.y)),y:Math.atan2(a.y,a.x)};}
function csqrt(a){const r=Math.hypot(a.x,a.y),t=Math.atan2(a.y,a.x),sr=Math.sqrt(r);return{x:sr*Math.cos(t/2),y:sr*Math.sin(t/2)};}
function cpow(a,b){
  if(Math.abs(b.y)<1e-12 && Math.abs(b.x-Math.round(b.x))<1e-12){
    let n=Math.round(b.x); if(n===0) return {x:1,y:0};
    const neg=n<0; n=Math.abs(n); let r={x:1,y:0};
    for(let k=0;k<n;k++) r=cmul(r,a);
    return neg?cdiv(ONE,r):r;
  }
  if(a.x===0&&a.y===0) return {x:0,y:0};
  return cexp(cmul(b,clog(a)));
}
function cabs(a){return Math.hypot(a.x,a.y);}

/* ============ 复数表达式解析器（自定义 f(z)，不用 eval）============ */
const CFUNCS={ exp:cexp, ln:clog, log:clog, sin:csin, cos:ccos, tan:ctan,
  sinh:csinh, cosh:ccosh, tanh:ctanh, sqrt:csqrt, conj:cconj,
  abs:a=>({x:cabs(a),y:0}), re:a=>({x:a.x,y:0}), im:a=>({x:a.y,y:0}) };
const CFUNC_ML={ sqrt:1 };
function parseCFunc(src, varName){
  varName = varName || "z";
  const s=String(src||""); let i=0, multivalued=false;
  const toks=[];
  while(i<s.length){
    const c=s[i];
    if(c===" "||c==="\t"){ i++; continue; }
    if(/[0-9.]/.test(c)){ let j=i+1; while(j<s.length&&/[0-9.]/.test(s[j])) j++; toks.push({t:"num",v:s.slice(i,j)}); i=j; continue; }
    if(/[a-zA-Zπ]/.test(c)){ let j=i+1; while(j<s.length&&/[a-zA-Z]/.test(s[j])) j++; toks.push({t:"id",v:s.slice(i,j)}); i=j; continue; }
    if("+-*/^(),".indexOf(c)>=0){ toks.push({t:c}); i++; continue; }
    if(c==="×"){ toks.push({t:"*"}); i++; continue; }
    if(c==="÷"){ toks.push({t:"/"}); i++; continue; }
    if(c==="−"){ toks.push({t:"-"}); i++; continue; }
    throw new Error("无法识别的字符：“"+c+"”");
  }
  let p=0;
  const peek=()=>toks[p], next=()=>toks[p++];
  const startsPrimary=tk=>tk&&(tk.t==="num"||tk.t==="id"||tk.t==="(");
  function wrap(node,need){ return node.prec<need ? `<mrow><mo>(</mo>${node.ml}<mo>)</mo></mrow>` : node.ml; }
  function parseExpr(){ return parseAdd(); }
  function parseAdd(){
    let L=parseMul();
    while(peek()&&(peek().t==="+"||peek().t==="-")){
      const op=next().t, R=parseMul(), Lml=wrap(L,1), Rml=wrap(R,op==="-"?2:1), lev=L.ev, rev=R.ev;
      L={ prec:1, ev: op==="+" ? z=>cadd(lev(z),rev(z)) : z=>csub(lev(z),rev(z)),
          ml: Lml+`<mo>${op==="+"?"+":"&#x2212;"}</mo>`+Rml };
    }
    return L;
  }
  function parseMul(){
    let L=parseUnary();
    while(true){
      const tk=peek();
      let op=null;
      if(tk&&(tk.t==="*"||tk.t==="/")){ op=next().t; }
      else if(startsPrimary(tk)){ op="*"; }
      else break;
      const R=parseUnary(), lev=L.ev, rev=R.ev;
      if(op==="/"){
        L={ prec:2, ev:z=>cdiv(lev(z),rev(z)), ml:`<mfrac><mrow>${L.ml}</mrow><mrow>${R.ml}</mrow></mfrac>` };
      }else{
        L={ prec:2, ev:z=>cmul(lev(z),rev(z)), ml: wrap(L,2)+wrap(R,2) };
      }
    }
    return L;
  }
  function parseUnary(){
    const tk=peek();
    if(tk&&tk.t==="-"){ next(); const R=parseUnary(); const rev=R.ev;
      return { prec:3, isIntConst:R.isIntConst, ev:z=>({x:-rev(z).x,y:-rev(z).y}), ml:`<mo>&#x2212;</mo>`+wrap(R,3) }; }
    if(tk&&tk.t==="+"){ next(); return parseUnary(); }
    return parsePow();
  }
  function parsePow(){
    const base=parsePrimary();
    if(peek()&&peek().t==="^"){
      next(); const ex=parseUnary(), bev=base.ev, eev=ex.ev;
      if(!ex.isIntConst) multivalued=true;
      return { prec:4, ev:z=>cpow(bev(z),eev(z)), ml:`<msup><mrow>${wrap(base,4)}</mrow><mrow>${ex.ml}</mrow></msup>` };
    }
    return base;
  }
  function parsePrimary(){
    const tk=next();
    if(!tk) throw new Error("表达式不完整");
    if(tk.t==="("){ const e=parseExpr(); if(!peek()||next().t!==")") throw new Error("缺少右括号 )"); return {prec:5,isIntConst:e.isIntConst,ev:e.ev,ml:e.ml}; }
    if(tk.t==="num"){ const v=parseFloat(tk.v); if(!isFinite(v)) throw new Error("非法数字：“"+tk.v+"”"); return {prec:5,isIntConst:Number.isInteger(v),ev:()=>({x:v,y:0}),ml:`<mn>${tk.v}</mn>`}; }
    if(tk.t==="id"){
      const nm=tk.v;
      if(nm===varName) return {prec:5,ev:z=>z,ml:`<mi>${varName}</mi>`};
      if(nm==="i") return {prec:5,ev:()=>({x:0,y:1}),ml:`<mi>i</mi>`};
      if(nm==="e") return {prec:5,ev:()=>({x:Math.E,y:0}),ml:`<mi>e</mi>`};
      if(nm==="pi"||nm==="π") return {prec:5,ev:()=>({x:Math.PI,y:0}),ml:`<mi>&#x3C0;</mi>`};
      const fn=CFUNCS[nm];
      if(!fn) throw new Error("未知的名称：“"+nm+"”");
      if(nm==="sqrt"||nm==="ln"||nm==="log") multivalued=true;
      if(!peek()||next().t!=="(") throw new Error("函数 "+nm+" 后要跟括号，如 "+nm+"("+varName+")");
      const arg=parseExpr(); if(!peek()||next().t!==")") throw new Error("函数 "+nm+" 缺少右括号 )");
      const aev=arg.ev;
      const ml = CFUNC_ML[nm]==1 ? `<msqrt>${arg.ml}</msqrt>`
                : (nm==="conj" ? `<mover>${wrap(arg,5)}<mo>&#x00AF;</mo></mover>`
                : `<mi>${nm}</mi><mo>&#x2061;</mo><mrow><mo>(</mo>${arg.ml}<mo>)</mo></mrow>`);
      return {prec:5, ev:z=>fn(aev(z)), ml};
    }
    throw new Error("无法解析：附近有多余符号");
  }
  const root=parseExpr();
  if(p<toks.length) throw new Error("表达式末尾有多余内容");
  root.ev({x:0.3,y:0.4});
  return { fn: z=>root.ev(z), ml: root.ml, multivalued };
}

/* ============ 被积函数表 ============
   analytic：true=处处解析(路径无关)；false=不解析(路径依赖)  */
const FUNCS=[
  {id:"z", ml:`<mi>z</mi>`, f:z=>z, analytic:true,
    note:"z 是整函数(处处解析) → 积分只取决于端点，与路径无关（例3.1）。"},
  {id:"z2", ml:`<msup><mi>z</mi><mn>2</mn></msup>`, f:z=>cmul(z,z), analytic:true,
    note:"z² 处处解析 → 路径无关，原函数 z³/3。"},
  {id:"ez", ml:`<msup><mi>e</mi><mi>z</mi></msup>`, f:z=>cexp(z), analytic:true,
    note:"eᶻ 处处解析 → 路径无关，原函数 eᶻ。"},
  {id:"re", ml:`<mi>Re</mi><mo>&#x2061;</mo><mi>z</mi>`, f:z=>({x:z.x,y:0}), analytic:false,
    note:"Re z 不满足 C-R 条件、处处不解析 → 积分依赖路径（例3.2）。"},
  {id:"conj", ml:`<mover><mi>z</mi><mo>&#x00AF;</mo></mover>`, f:z=>({x:z.x,y:-z.y}), analytic:false,
    note:"z̄ 处处不解析 → 路径依赖。"},
  {id:"im", ml:`<mi>Im</mi><mo>&#x2061;</mo><mi>z</mi>`, f:z=>({x:z.y,y:0}), analytic:false,
    note:"Im z 不解析 → 路径依赖。"}
];
let F=FUNCS[0];
const Fcustom={id:"custom", kind:"custom", ml:`<mover><mi>z</mi><mo>&#x00AF;</mo></mover>`,
  f:z=>({x:z.x,y:-z.y}), analytic:null,
  note:"自定义函数：是否路径无关由三条路径的数值积分是否一致来判断。"};

/* ============ 视口与坐标 ============ */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const overlay=document.getElementById("cvOverlay");
let W=900,H=480, cx=450, cy=240, viewHalf=2.6, s=90;
const show={vals:true, grid:true, axis:true};
const NINT=1500;   // 每条路径采样段数

/* 端点与路径控制点（世界坐标） */
let A={x:0,y:0}, B={x:2,y:1};
let P={x:0,y:1};      // 折线拐点
let Q={x:1.3,y:-0.4}; // 曲线(二次Bézier)控制点

function layout(){ s=Math.min(W,H)/2/viewHalf*0.9; }
function toS(z){ return {x:cx+z.x*s, y:cy-z.y*s}; }
function fromS(sx,sy){ return {x:(sx-cx)/s, y:(cy-sy)/s}; }

/* ============ 三条路径的采样点 ============ */
function lerp(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
function pathLinePts(N){ const a=[]; for(let k=0;k<=N;k++) a.push(lerp(A,B,k/N)); return a; }
function pathPolyPts(N){
  const a=[], h=Math.floor(N/2);
  for(let k=0;k<=h;k++) a.push(lerp(A,P,k/h));
  for(let k=1;k<=N-h;k++) a.push(lerp(P,B,k/(N-h)));
  return a;
}
function pathBezPts(N){
  const a=[];
  for(let k=0;k<=N;k++){ const t=k/N, u=1-t;
    a.push({ x:u*u*A.x+2*u*t*Q.x+t*t*B.x, y:u*u*A.y+2*u*t*Q.y+t*t*B.y }); }
  return a;
}
const PATHS=[
  {id:"line", name:"① 直线", color:"#2563eb", cls:"p1", pts:pathLinePts},
  {id:"poly", name:"② 折线", color:"#dd6b20", cls:"p2", pts:pathPolyPts},
  {id:"bez",  name:"③ 曲线", color:"#2f855a", cls:"p3", pts:pathBezPts}
];

/* ============ 开路径积分：∫_C f dz ≈ Σ f(zmid)·Δz（中点法）============ */
function pathIntegral(fn, pts){
  let sx=0, sy=0, maxAbs=0, skipped=0;
  for(let k=0;k<pts.length-1;k++){
    const a=pts[k], b=pts[k+1];
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const dx=b.x-a.x, dy=b.y-a.y;
    const fz=fn(mid);
    if(!isFinite(fz.x)||!isFinite(fz.y)){ skipped++; continue; }
    const m=Math.hypot(fz.x,fz.y); if(m>maxAbs) maxAbs=m;
    sx += fz.x*dx - fz.y*dy;
    sy += fz.x*dy + fz.y*dx;
  }
  // maxAbs 极大或出现非有限值 → 路径掠过 f 的奇点, 中点法在此不可靠
  return {x:sx,y:sy, maxAbs, skipped, singular: skipped>0 || maxAbs>1e3};
}
function prefixIntegral(fn, pts){
  const pre=[{x:0,y:0}]; let sx=0, sy=0;
  for(let k=0;k<pts.length-1;k++){
    const a=pts[k], b=pts[k+1];
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const dx=b.x-a.x, dy=b.y-a.y;
    const fz=fn(mid);
    if(isFinite(fz.x)&&isFinite(fz.y)){ sx += fz.x*dx-fz.y*dy; sy += fz.x*dy+fz.y*dx; }
    pre.push({x:sx,y:sy});
  }
  return pre;
}

/* ============ 叠加层标签 ============ */
function clearLabels(){ overlay.innerHTML=""; }
function addLabel(html,x,y,color,size,opt){
  const d=document.createElement("div"); d.className="lbl";
  d.style.left=x+"px"; d.style.top=y+"px"; d.style.color=color;
  if(size) d.style.fontSize=size+"px";
  if(opt&&opt.anchor==="left") d.style.transform="translate(0,-50%)";
  d.innerHTML=html; overlay.appendChild(d);
}

/* ============ 绘制助手 ============ */
function arrowHead(x,y,ang,color,len){
  const ah=len||8; ctx.save(); ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineTo(x-ah*Math.cos(ang-0.42), y-ah*Math.sin(ang-0.42));
  ctx.lineTo(x-ah*Math.cos(ang+0.42), y-ah*Math.sin(ang+0.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function handleDot(q,color){
  ctx.save(); ctx.fillStyle="#fff"; ctx.strokeStyle=color||"#2563eb"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(q.x,q.y,5.5,0,7); ctx.fill(); ctx.stroke(); ctx.restore();
}
function endPt(q,color,txt){
  ctx.save(); ctx.fillStyle=color; ctx.beginPath(); ctx.arc(q.x,q.y,6,0,7); ctx.fill();
  ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
}
function drawPolyline(pts,color,width){
  ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width||3; ctx.beginPath();
  pts.forEach((z,k)=>{ const q=toS(z); if(k===0)ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y); });
  ctx.stroke(); ctx.restore();
  // 方向箭头（路径中部）
  const idx=Math.floor(pts.length*0.55), A2=toS(pts[idx]), B2=toS(pts[Math.min(pts.length-1,idx+2)]);
  arrowHead(A2.x,A2.y, Math.atan2(B2.y-A2.y,B2.x-A2.x), color, 9);
}

/* ============ 主绘制 ============ */
let animOn=false, animP=0, animData=null;
function currentF(){ return F.kind==="custom" ? Fcustom : F; }
function draw(){
  const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H); clearLabels();
  layout();

  ctx.fillStyle="#fdfefe"; ctx.fillRect(0,0,W,H);
  if(show.grid){
    ctx.strokeStyle="#edf1f6"; ctx.lineWidth=1;
    const lo=Math.ceil(-viewHalf/0.5)*0.5;
    for(let g=lo; g<=viewHalf+1e-9; g+=0.5){
      let a=toS({x:g,y:-viewHalf}), b=toS({x:g,y:viewHalf});
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      let c=toS({x:-viewHalf,y:g}), d=toS({x:viewHalf,y:g});
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.stroke();
    }
  }
  const o=toS({x:0,y:0});
  if(show.axis){
    ctx.strokeStyle="#5f6b7a"; ctx.fillStyle="#5f6b7a"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(6,o.y); ctx.lineTo(W-8,o.y); ctx.stroke(); arrowHead(W-7,o.y,0,"#5f6b7a");
    ctx.beginPath(); ctx.moveTo(o.x,H-6); ctx.lineTo(o.x,10); ctx.stroke(); arrowHead(o.x,9,-Math.PI/2,"#5f6b7a");
    addLabel(mml("<mi>Re</mi>"), W-20, o.y-14, "#4a5568", 13);
    addLabel(mml("<mi>Im</mi>"), o.x+16, 22, "#4a5568", 13);
  }

  const fn=currentF().f;
  const samples=PATHS.map(pp=>pp.pts(NINT));
  const integrals=samples.map(pts=>pathIntegral(fn,pts));

  // 折线拐点、Bézier 引导虚线
  ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle="rgba(47,133,90,.35)"; ctx.lineWidth=1;
  let qa=toS(A),qc=toS(Q),qb=toS(B);
  ctx.beginPath(); ctx.moveTo(qa.x,qa.y); ctx.lineTo(qc.x,qc.y); ctx.lineTo(qb.x,qb.y); ctx.stroke();
  ctx.restore();

  // 三条路径
  PATHS.forEach((pp,i)=> drawPolyline(samples[i], pp.color, 3));

  // 动画移动点 + 已走弧高亮
  if(animOn && animData){
    PATHS.forEach((pp,i)=>{
      const pts=animData.samples[i]; const m=Math.max(1,Math.floor(animP*(pts.length-1)));
      ctx.save(); ctx.strokeStyle=pp.color; ctx.lineWidth=5.5; ctx.globalAlpha=0.35; ctx.beginPath();
      for(let k=0;k<=m;k++){ const q=toS(pts[k]); if(k===0)ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y); }
      ctx.stroke(); ctx.restore();
      const head=toS(pts[m]);
      ctx.save(); ctx.fillStyle=pp.color; ctx.beginPath(); ctx.arc(head.x,head.y,6,0,7); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    });
  }

  // 端点与控制点
  endPt(toS(A), "#1a202c"); endPt(toS(B), "#1a202c");
  handleDot(toS(P), "#dd6b20"); handleDot(toS(Q), "#2f855a");
  addLabel(mml("<mi>A</mi>"), toS(A).x-14, toS(A).y+14, "#1a202c", 14);
  addLabel(mml("<mi>B</mi>"), toS(B).x+14, toS(B).y-12, "#1a202c", 14);

  // 图上标注各路径积分值
  if(show.vals){
    PATHS.forEach((pp,i)=>{
      const pts=samples[i], mp=toS(pts[Math.floor(pts.length*0.35)]);
      addLabel(mml(INT+"<mo>&#x2248;</mo>"+mmlComplex(integrals[i].x,integrals[i].y)),
               mp.x, mp.y-16, pp.color, 13);
    });
  }

  updateReadout(integrals);
}

/* ============ 读数 ============ */
function verdictIndependent(integrals){
  let mx=0, scale=1;
  for(const I of integrals){ scale=Math.max(scale, Math.hypot(I.x,I.y)); }
  for(let a=0;a<integrals.length;a++)for(let b=a+1;b<integrals.length;b++){
    mx=Math.max(mx, Math.hypot(integrals[a].x-integrals[b].x, integrals[a].y-integrals[b].y));
  }
  return { indep: mx < 1e-3*scale+2e-3, maxdiff:mx };
}
function updateReadout(integrals){
  const cf=currentF();
  const v=verdictIndependent(integrals);
  let html = `<h2 style="margin-bottom:8px;">结果</h2>`+
    `<div><span class="k">被积函数</span> ${mml("<mi>f</mi><mo>(</mo><mi>z</mi><mo>)</mo><mo>=</mo>"+cf.ml)}</div>`+
    `<div><span class="k">端点</span> ${mml("<mi>A</mi><mo>=</mo>"+mmlComplex(A.x,A.y)+"<mo>,</mo><mspace width='4px'/><mi>B</mi><mo>=</mo>"+mmlComplex(B.x,B.y))}</div>`;

  PATHS.forEach((pp,i)=>{
    html += `<div class="val ${pp.cls}"><span class="t">${pp.name}路径</span>`+
      `<span class="big">${mml(INT+"<mo>&#x2248;</mo>"+mmlComplex(integrals[i].x,integrals[i].y))}</span></div>`;
  });

  const singular = integrals.some(I=>I.singular);
  if(singular){
    // 路径逼近奇点: 读数已不可靠, 优先给出局限提示而非误导性判定
    html += `<div class="verdict dep">⚠ 有路径<b>逼近 f 的奇点</b>（如 ${mml("<mfrac><mn>1</mn><mi>z</mi></mfrac>")} 在 0 处）。<br>`+
      `此处中点法数值积分会<b>失真</b>，上面的读数与判定<b>不可靠</b>——请把路径拖离奇点。</div>`;
  }else if(v.indep){
    html += `<div class="verdict indep">三条路径积分<b>相同</b> → 与路径<b>无关</b>（只取决于端点 A、B）。</div>`;
  }else{
    html += `<div class="verdict dep">三条路径积分<b>各不相同</b>（最大相差 ≈ ${fmt(v.maxdiff)}）→ 积分<b>依赖路径</b>。</div>`;
  }

  // 原因（解析性）
  let reason="";
  if(cf.analytic===true) reason="f 在包含这些路径的单连通域内<b>解析</b> → 由柯西积分定理，积分与路径无关。";
  else if(cf.analytic===false) reason="f <b>不满足柯西-黎曼条件、处处不解析</b> → 一般依赖路径。";
  else reason = v.indep ? "数值上三路径一致，通常意味着 f 在此区域解析。"
                        : "数值上三路径不一致，意味着 f 在此区域不解析。";
  html += `<div class="corr ${v.indep?'':'warn'}">${reason}</div>`;
  html += `<div style="color:var(--sub);font-size:12.5px;margin-top:8px;">${cf.note}</div>`;

  document.getElementById("readout").innerHTML=html;
}

/* ============ 交互：拖端点 / 控制点 ============ */
let drag=null;   // {key:'A'|'B'|'P'|'Q'}
function screenXY(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function pickHandle(m){
  let best=null, bd=16;
  const cand=[["A",A],["B",B],["P",P],["Q",Q]];
  for(const [key,pt] of cand){ const q=toS(pt); const d=Math.hypot(m.x-q.x,m.y-q.y); if(d<bd){ bd=d; best={key}; } }
  return best;
}
cv.addEventListener("pointerdown",e=>{
  if(animOn) return;
  const m=screenXY(e); const h=pickHandle(m);
  if(!h) return;
  drag=h; cv.setPointerCapture(e.pointerId); cv.classList.add("grabbing");
});
cv.addEventListener("pointermove",e=>{
  if(!drag) return;
  const m=screenXY(e), w=fromS(m.x,m.y);
  if(drag.key==="A") A={x:w.x,y:w.y};
  else if(drag.key==="B") B={x:w.x,y:w.y};
  else if(drag.key==="P") P={x:w.x,y:w.y};
  else Q={x:w.x,y:w.y};
  syncEndInputs(); draw();
});
function endPointer(){ if(drag){ EduTelemetry.log("drag", drag.key); } drag=null; cv.classList.remove("grabbing"); }
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  viewHalf=Math.min(9, Math.max(1.2, viewHalf*(e.deltaY<0?0.92:1.087)));
  draw();
},{passive:false});

/* ============ 端点输入框 ============ */
function bindEnd(id,get,set){ const el=document.getElementById(id);
  el.addEventListener("input",()=>{ const v=parseFloat(el.value); if(!isNaN(v)){ set(v); draw(); } }); }
bindEnd("ax",()=>A.x,v=>A.x=v); bindEnd("ay",()=>A.y,v=>A.y=v);
bindEnd("bx",()=>B.x,v=>B.x=v); bindEnd("by",()=>B.y,v=>B.y=v);
function syncEndInputs(){
  const m={ax:A.x,ay:A.y,bx:B.x,by:B.y};
  for(const id in m){ const el=document.getElementById(id); if(document.activeElement!==el) el.value=round3(m[id]); }
}

/* ============ 动画：三条路径同时积分 ============ */
function startAnim(){
  if(animOn) return;
  const fn=currentF().f;
  const samples=PATHS.map(pp=>pp.pts(NINT));
  animData={ samples, prefix:samples.map(pts=>prefixIntegral(fn,pts)) };
  animOn=true; animP=0; EduTelemetry.log("anim");
  const dur=3000, t0=performance.now();
  function step(now){
    animP=Math.min(1,(now-t0)/dur);
    draw();
    const box=document.getElementById("readout");
    let extra=`<div class="val" style="border-color:#fbd38d;background:#fffaf0;"><span class="t">已积到 ${Math.round(animP*100)}%（累积值）</span>`;
    PATHS.forEach((pp,i)=>{
      const pre=animData.prefix[i]; const m=Math.max(1,Math.floor(animP*(pre.length-1)));
      extra += `<div style="color:${pp.color};font-size:13px;">${pp.name}: ${mml(mmlComplex(pre[m].x,pre[m].y))}</div>`;
    });
    extra += `</div>`;
    box.insertAdjacentHTML("afterbegin", extra);
    if(animP<1) requestAnimationFrame(step);
    else { animOn=false; setTimeout(draw,400); }
  }
  requestAnimationFrame(step);
}
document.getElementById("bAnim").onclick=startAnim;
document.getElementById("bReset").onclick=()=>{ viewHalf=2.6; draw(); };

/* ============ 尺寸与启动 ============ */
function resize(){
  const wrap=cv.parentElement, dpr=window.devicePixelRatio||1;
  W=wrap.clientWidth; H=wrap.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  cx=W/2; cy=H/2;
  draw();
}
window.addEventListener("resize",resize);
