<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉普拉斯变换学习助手（试用） · 复变函数与积分变换</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<style>
  :root{
    --blue:#2b6cb0; --gold:#b7791f; --green:#2f855a;
    --ink:#1a202c; --sub:#4a5568; --line:#e2e8f0; --bg:#f7fafc; --card:#fff;
    --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; color:var(--ink);
       background:var(--bg); line-height:1.65; display:flex; flex-direction:column;}
  .top{background:linear-gradient(90deg,#1e4e8c,#2b6cb0); color:#fff; padding:12px 20px;
       display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .top h1{font-size:18px; margin:0; font-weight:700;}
  .tag{background:rgba(255,255,255,.18); padding:3px 10px; border-radius:20px; font-size:12px;}
  .top .sp{flex:1;}
  .top button{background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4);
       border-radius:16px; padding:4px 12px; font-size:12.5px; cursor:pointer;}
  .notice{background:#fffbea; border-bottom:1px solid #f6e05e; color:#744210; font-size:12.5px; padding:6px 20px;}
  #chat{flex:1; overflow-y:auto; padding:18px 12px 8px;}
  .wrap{max-width:820px; margin:0 auto;}
  .msg{display:flex; margin:10px 0;}
  .msg.user{justify-content:flex-end;}
  .bubble{max-width:86%; padding:10px 14px; border-radius:12px; box-shadow:var(--shadow); font-size:14.5px;
          overflow-x:auto; word-break:break-word;}
  .msg.bot .bubble{background:var(--card); border:1px solid var(--line); border-top-left-radius:4px;}
  .msg.user .bubble{background:#ebf4ff; border:1px solid #bee3f8; border-top-right-radius:4px; white-space:pre-wrap;}
  .msg.err .bubble{background:#fff5f5; border:1px solid #fed7d7; color:#9b2c2c;}
  .bubble p{margin:.35em 0;} .bubble ul,.bubble ol{margin:.3em 0; padding-left:1.4em;}
  .bubble h3,.bubble h4{margin:.6em 0 .3em; font-size:15px; color:var(--blue);}
  .bubble code{background:#edf2f7; padding:1px 5px; border-radius:4px; font-size:13px;}
  .bubble table{border-collapse:collapse; margin:.4em 0;} .bubble td,.bubble th{border:1px solid var(--line); padding:3px 8px;}
  .bubble a{color:var(--blue);}
  .katex-display{margin:.5em 0; overflow-x:auto; overflow-y:hidden;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
  .chip{background:#fff; border:1px solid #bee3f8; color:var(--blue); border-radius:16px; padding:5px 12px;
        font-size:13px; cursor:pointer;}
  .chip:hover{background:#ebf4ff;}
  .typing{color:var(--sub); font-size:13.5px;}
  .typing i{display:inline-block; width:6px; height:6px; margin:0 2px; background:#a0aec0; border-radius:50%;
            animation:b 1.2s infinite;} .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .bar{border-top:1px solid var(--line); background:#fff; padding:10px 12px;}
  .bar .wrap{display:flex; gap:8px; align-items:flex-end;}
  textarea{flex:1; resize:none; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font:inherit;
           font-size:14.5px; min-height:44px; max-height:180px; outline:none;}
  textarea:focus{border-color:var(--blue);}
  #send{background:var(--blue); color:#fff; border:none; border-radius:10px; padding:0 18px; height:44px; font-size:14.5px; cursor:pointer;}
  #send:disabled{background:#a0aec0; cursor:default;}
  #pic{background:#fff; color:var(--blue); border:1px solid #bee3f8; border-radius:10px; width:44px; height:44px;
       font-size:20px; cursor:pointer; flex:none;} #pic:disabled{opacity:.5; cursor:default;}
  .ocrnote{max-width:820px; margin:0 auto 6px; font-size:12.5px; color:#2c5282; background:#ebf8ff; border:1px solid #bee3f8;
           border-radius:8px; padding:6px 10px; display:none; align-items:center; gap:10px;}
  .ocrnote img{height:48px; border-radius:4px; border:1px solid var(--line);}
  .ocrnote .x{margin-left:auto; cursor:pointer; color:#718096; align-self:flex-start;}
  .ocrnote{flex-wrap:wrap;} .ocrnote img{cursor:zoom-in;}
  .ocrprev{flex-basis:100%; background:#fff; border:1px solid var(--line); border-radius:6px; padding:4px 10px; max-height:160px;
           overflow:auto; color:var(--ink); font-size:14px; display:none;}
  .ocrprev::before{content:"预览（核对与照片是否一致）"; display:block; font-size:11.5px; color:#718096;}
  .bubble .cursor{display:inline-block; width:7px; height:15px; background:#a0aec0; vertical-align:-2px; animation:b 1s infinite;}
  .hint{max-width:820px; margin:4px auto 0; font-size:12px; color:#718096;}
</style>
<!-- 百度统计（与 CloudBase 计数并行；事件标签=稳定计数键）-->
<script>
var _hmt = _hmt || [];
_hmt.push(["_trackEvent", "fubian", "open", "fb-laplace-tutor"]);
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?193c927113cbabe0184f0b2e8d61fcc2";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

</script>
</head>
<body>
<div class="top">
  <h1>小拉 · 拉普拉斯变换学习助手</h1><span class="tag">试用版</span>
  <span class="sp"></span>
  <button id="clear" title="清空本页对话">新对话</button>
</div>
<div class="notice">小拉不会直接给作业答案，而是陪你一步步想。AI 也会算错，重要结论请回代或用课程小工具验证。对话内容会匿名记录，用于改进教学，请勿输入个人信息。</div>

<div id="chat"><div class="wrap" id="list"></div></div>

<div class="bar">
  <div class="ocrnote" id="ocrnote"><img id="ocrimg" alt=""><span id="ocrmsg"></span><span class="x" id="ocrx" title="关闭">✕</span><div class="ocrprev" id="ocrprev"></div></div>
  <div class="wrap">
    <button id="pic" title="拍照或上传题目/手写过程">📷</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="inp" rows="1" placeholder="问一个概念，或贴出题目和你已经写的步骤……（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">公式可以直接打，如 F(s)=1/(s+2)，或用 LaTeX：$\frac{1}{s+2}$；也可以点 📷 拍照，识别成文字后核对再发送</div>
</div>

<script>
(function(){
  var ENDPOINT = "https://fubian-d6g8u2u9d2f52010b-1475289034.ap-shanghai.app.tcloudbase.com/tutor";
  // 本地调试：localhost 下可用 ?api=http://localhost:9000 指向本地服务
  var m0 = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.search.match(/[?&]api=([^&]+)/);
  if (m0) ENDPOINT = decodeURIComponent(m0[1]);
  var STORE = "fbtutor_laplace_v1";
  var WELCOME = "你好，我是**小拉**，《复变函数与积分变换》拉普拉斯变换一章的学习助手。\n\n我不会直接告诉你作业答案，但会陪你一步步把题想明白。你可以：\n- 问一个没弄懂的概念\n- 贴出卡住的题和你已经写的步骤\n- 把做完的解答发给我检查";
  var CHIPS = ["拉普拉斯变换和傅里叶变换有什么关系？","部分分式分解遇到重根怎么办？","为什么极点在左半平面系统就稳定？","帮我检查一道解微分方程的题"];

  var list = document.getElementById("list"), chat = document.getElementById("chat");
  var inp = document.getElementById("inp"), send = document.getElementById("send");
  var state = load();

  function load(){
    try { var s = JSON.parse(localStorage.getItem(STORE)); if (s && s.sid && Array.isArray(s.msgs)) return s; } catch(e){}
    return { sid: rid(), msgs: [] };
  }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }
  function rid(){ return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }

  // ---- 极简 Markdown + KaTeX 渲染（先抽出公式，再处理文本，最后还原） ----
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function tex(src, display){
    try { return katex.renderToString(src, { displayMode: display, throwOnError: false, strict: "ignore", macros: { "\\ii": "\\mathrm{i}", "\\ee": "\\mathrm{e}" } }); }
    catch(e){ return esc(src); }
  }
  function inline(s){
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[^"'>=])(https?:\/\/[^\s<)，。；]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  function md(text){
    var math = [];
    var hold = function(html){ math.push(html); return "\u0000" + (math.length - 1) + "\u0000"; };
    text = text.replace(/\$\$([\s\S]+?)\$\$/g, function(_, m){ return "\n" + hold(tex(m, true)) + "\n"; })
               .replace(/\\\[([\s\S]+?)\\\]/g, function(_, m){ return "\n" + hold(tex(m, true)) + "\n"; })
               .replace(/\\\(([\s\S]+?)\\\)/g, function(_, m){ return hold(tex(m, false)); })
               .replace(/\$([^\$\n]+?)\$/g, function(_, m){ return hold(tex(m, false)); });
    var lines = esc(text).split("\n"), out = [], listT = null, tbl = null;
    function closeList(){ if (listT){ out.push("</" + listT + ">"); listT = null; } }
    function closeTbl(){ if (tbl){ out.push("<table>" + tbl.join("") + "</table>"); tbl = null; } }
    lines.forEach(function(l){
      var t = l.trim(), m;
      if (/^\|.*\|$/.test(t)){
        closeList();
        if (/^\|[\s:|-]+\|$/.test(t)) return;
        var cells = t.slice(1, -1).split("|").map(function(c){ return "<td>" + inline(c.trim()) + "</td>"; });
        (tbl = tbl || []).push("<tr>" + cells.join("") + "</tr>"); return;
      }
      closeTbl();
      if ((m = t.match(/^[-*]\s+(.*)/))){ if (listT !== "ul"){ closeList(); out.push("<ul>"); listT = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); return; }
      if ((m = t.match(/^\d+[.)、]\s*(.*)/))){ if (listT !== "ol"){ closeList(); out.push("<ol>"); listT = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); return; }
      closeList();
      if ((m = t.match(/^#{1,6}\s+(.*)/))){ out.push("<h4>" + inline(m[1]) + "</h4>"); return; }
      if (t === "") return;
      if (/^\u0000\d+\u0000$/.test(t)){ out.push(t); return; }
      out.push("<p>" + inline(t) + "</p>");
    });
    closeList(); closeTbl();
    return out.join("").replace(/\u0000(\d+)\u0000/g, function(_, i){ return math[+i]; });
  }

  function add(role, text, cls){
    var d = document.createElement("div"); d.className = "msg " + (cls || (role === "user" ? "user" : "bot"));
    var b = document.createElement("div"); b.className = "bubble";
    if (role === "user") b.textContent = text; else b.innerHTML = md(text);
    d.appendChild(b); list.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
  }
  function render(){
    list.innerHTML = "";
    add("assistant", WELCOME);
    if (!state.msgs.length){
      var c = document.createElement("div"); c.className = "chips";
      CHIPS.forEach(function(q){ var s = document.createElement("span"); s.className = "chip"; s.textContent = q;
        s.onclick = function(){ inp.value = q; inp.focus(); autosize(); }; c.appendChild(s); });
      list.appendChild(c);
    }
    state.msgs.forEach(function(m){ add(m.role, m.content); });
  }

  var busy = false;
  var pic = document.getElementById("pic"), file = document.getElementById("file");
  function setBusy(v){ busy = v; send.disabled = v; pic.disabled = v; }
  function fail(wait, msg, q){ wait.remove(); state.msgs.pop(); save(); add("assistant", msg, "err"); inp.value = q; autosize(); }
  function niceErr(e, dflt){ return (e && e.message && !/fetch|network|load failed/i.test(e.message)) ? e.message : dflt; }

  function submit(){
    var q = inp.value.trim(); if (!q || busy) return;
    if (q.length > 2000){ alert("一次最多 2000 字，请分开发。"); return; }
    setBusy(true); inp.value = ""; autosize(); hideOcr();
    var chips = list.querySelector(".chips"); if (chips) chips.remove();
    state.msgs.push({ role: "user", content: q }); save(); add("user", q);
    var wait = add("assistant", ""), bub = wait.querySelector(".bubble");
    var t0 = Date.now(), text = "", pending = false, ended = false;
    function thinking(){ bub.innerHTML = '<span class="typing">小拉在想（' + Math.round((Date.now() - t0) / 1000) + ' 秒）<i></i><i></i><i></i></span>'; }
    thinking(); var tick = setInterval(function(){ if (!text) thinking(); }, 1000);
    function paint(){ pending = false; bub.innerHTML = md(text) + (ended ? "" : '<span class="cursor"></span>');
      if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 160) chat.scrollTop = chat.scrollHeight; }
    function schedule(){ if (!pending){ pending = true; requestAnimationFrame(paint); } }

    fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ sid: state.sid, messages: state.msgs.slice(-16) }) })
    .then(function(r){
      var ct = r.headers.get("content-type") || "";
      if (ct.indexOf("text/event-stream") < 0)
        return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error(j.error || ("服务返回异常（" + r.status + "）")); });
      var reader = r.body.getReader(), dec = new TextDecoder(), buf = "", errMsg = null;
      function handle(block){
        block.split("\n").forEach(function(line){
          if (line.indexOf("data:") !== 0) return;
          var o; try { o = JSON.parse(line.slice(5)); } catch(e){ return; }
          if (o.t === "delta"){ text += o.s; schedule(); }
          else if (o.t === "error"){ errMsg = o.s; }
        });
      }
      function pump(){
        return reader.read().then(function(x){
          if (x.done){ if (buf) handle(buf); return; }
          buf += dec.decode(x.value, { stream: true });
          var parts = buf.split("\n\n"); buf = parts.pop();
          parts.forEach(handle);
          return pump();
        });
      }
      return pump().then(function(){ if (errMsg && !text) throw new Error(errMsg); return errMsg; });
    })
    .then(function(errMsg){
      clearInterval(tick); ended = true;
      if (!text){ fail(wait, "没有生成回答，请换个说法再试一次。", q); return; }
      paint(); state.msgs.push({ role: "assistant", content: text }); save();
      if (errMsg) add("assistant", errMsg + "（上面的回答可能不完整）", "err");
    })
    .catch(function(e){
      clearInterval(tick); ended = true;
      if (text){ paint(); state.msgs.push({ role: "assistant", content: text }); save(); add("assistant", "连接中断，上面的回答可能不完整。", "err"); }
      else fail(wait, niceErr(e, "网络连接失败，请稍后再试。"), q);
    })
    .then(function(){ setBusy(false); inp.focus(); });
  }

  // ---- 拍照识别：压缩 → /ocr → 填入输入框供学生核对 ----
  var ocrnote = document.getElementById("ocrnote"), ocrimg = document.getElementById("ocrimg"), ocrmsg = document.getElementById("ocrmsg");
  function showOcr(src, msg){ if (src) ocrimg.src = src; ocrimg.style.display = src || ocrimg.src ? "" : "none"; ocrmsg.textContent = msg; ocrnote.style.display = "flex"; }
  var ocrprev = document.getElementById("ocrprev"), previewOn = false;
  function preview(){ if (!previewOn) return; ocrprev.innerHTML = md(inp.value); ocrprev.style.display = inp.value.trim() ? "block" : "none"; }
  inp.addEventListener("input", preview);
  ocrimg.onclick = function(){ if (ocrimg.src) { var w = window.open(); if (w) w.document.write('<img src="' + ocrimg.src + '" style="max-width:100%">'); } };
  function hideOcr(){ ocrnote.style.display = "none"; previewOn = false; ocrprev.style.display = "none"; }
  document.getElementById("ocrx").onclick = hideOcr;
  pic.onclick = function(){ if (!busy) file.click(); };
  function compress(f){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(f), im = new Image();
      im.onload = function(){
        var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var q = 0.85, d = c.toDataURL("image/jpeg", q);
        while (d.length > 1800000 && q > 0.4){ q -= 0.15; d = c.toDataURL("image/jpeg", q); }
        resolve(d);
      };
      im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("读不了这张图片，请换成 jpg/png 照片")); };
      im.src = url;
    });
  }
  file.onchange = function(){
    var f = file.files && file.files[0]; file.value = ""; if (!f || busy) return;
    setBusy(true);
    compress(f).then(function(d){
      showOcr(d, "正在识别图片中的内容……");
      return fetch(ENDPOINT.replace(/\/$/, "") + "/ocr", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ sid: state.sid, image: d }) })
        .then(function(r){ return r.json().catch(function(){ return { error: "服务返回异常（" + r.status + "）" }; }); })
        .then(function(j){
          if (!j.text) throw new Error(j.error || "没认出来，换张清楚点的照片试试。");
          var pre = inp.value.trim();
          inp.value = (pre ? pre + "\n" : "") + j.text + "\n\n（以上由照片识别，请核对后补充你的问题，再发送）";
          autosize(); inp.focus();
          showOcr(d, "已识别并填入输入框。识别可能有误，请对照照片核对、修改，再发送。");
          previewOn = true; preview();
        });
    }).catch(function(e){ showOcr("", niceErr(e, "网络连接失败，请稍后再试。")); })
      .then(function(){ setBusy(false); });
  };

  function autosize(){ inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 180) + "px"; }

  send.onclick = submit;
  inp.addEventListener("input", autosize);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); } });
  document.getElementById("clear").onclick = function(){
    if (state.msgs.length && !confirm("清空当前对话，开始新对话？")) return;
    state = { sid: rid(), msgs: [] }; save(); render();
  };
  render();
})();
</script>
</body>
</html>
